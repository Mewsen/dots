XDG_CONFIG_HOME=$HOME/.config
XDG_DATA_HOME=$HOME/.local/share
XDG_STATE_HOME=$HOME/.local/state
XDG_CACHE_HOME=$HOME/.cache
PERSONAL=$HOME/personal

SSH_ASKPASS=/usr/bin/ksshaskpass
SSH_ASKPASS_REQUIRE=prefer

LANG=en_US.UTF-8
EDITOR="emacsclient -c -a ''"
VISUAL="emacsclient -c -a ''"
GIT_EDITOR="emacsclient -c -a ''"
EMAIL="michael@tews.dev"
BROWSER=firefox
TERMINAL=xterm-256color
SHELL=/usr/bin/bash

PYTHONSTARTUP=$XDG_DATA_HOME/python/pythonrc
NPM_CONFIG_USERCONFIG=$XDG_CONFIG_HOME/npm/npmrc
ANDROID_USER_HOME=$XDG_DATA_HOME/android
ANDROID_HOME=$ANDROID_USER_HOME/sdk
TEXMFVAR=$XDG_CACHE_HOME/texlive/texmf-var
NUGET_PACKAGES=$XDG_CACHE_HOME/NuGetPackages
NODE_REPL_HISTORY=$XDG_DATA_HOME/node_repl_history
MINIKUBE_HOME=$XDG_DATA_HOME/minikube
GRADLE_USER_HOME=$XDG_DATA_HOME/gradle
GTK2_RC_FILES=$XDG_CONFIG_HOME/gtk-2.0/gtkrc
IPYTHONDIR=$XDG_CONFIG_HOME/ipython
DOTNET_CLI_HOME=$XDG_DATA_HOME/dotnet
HISTFILE=$XDG_STATE_HOME/bash/history


GOPATH=$XDG_DATA_HOME/go
GOBIN=$GOPATH/bin
CARGO_HOME=$XDG_DATA_HOME/cargo
RUSTUP_HOME=$XDG_DATA_HOME/rustup

PATH=$HOME/.local/bin:$PATH
PATH=/usr/local/go/bin:$PATH
PATH=$GOBIN:$PATH
PATH=$CARGO_HOME/bin:$PATH

XDG_DATA_DIRS=${XDG_DATA_DIRS:+$XDG_DATA_DIRS:}/usr/share:/var/lib/flatpak/exports/share:$XDG_DATA_HOME/flatpak/exports/share
RCLONE_PLUGIN_PATH=$XDG_DATA_HOME/rclone/plugins
_JAVA_OPTIONS=-Djava.util.prefs.userRoot=$XDG_CONFIG_HOME/java
